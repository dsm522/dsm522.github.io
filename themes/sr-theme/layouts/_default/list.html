{{ define "main" }}
<div class="post-page">
  <div class="post-container post-list-container">
    <h1 class="post-title" style="margin-bottom:3rem;">{{ .Title }}</h1>
    {{ range .Pages.ByDate.Reverse }}
    <article class="post-list-item">
      {{ with .Params.image }}
      <a href="{{ $.Permalink }}" class="post-list-thumb" aria-label="Read {{ $.Title }}">
        <img src="{{ . }}" alt="{{ $.Title }}">
      </a>
      {{ end }}
      <div class="post-list-body">
        <p class="blog-date">{{ .Date.Format "2 January 2006" }}</p>
        <h2 class="post-list-title">
          <a href="{{ .Permalink }}">{{ .Title }}</a>
        </h2>
        <p class="post-list-excerpt">{{ .Summary | plainify | htmlUnescape | truncate 200 }}</p>
        <a href="{{ .Permalink }}" class="blog-read-more">Read more →</a>
      </div>
    </article>
    {{ end }}
  </div>
</div>
{{ end }}
